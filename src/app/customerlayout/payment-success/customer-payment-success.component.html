<div class="row align-items-center justify-content-center min-vh-75 mx-0">
  <div class="col-12 col-md-6 col-lg-4 text-center py-4 text-color-theme">
    
    <div class="mb-4">
      <i class="bi bi-check-circle-fill text-success display-1"></i>
    </div>
    
    <h2 class="font-weight-bold mb-2">Payment Successful!</h2>
    <p class="text-muted mb-4">Your ticket booking is confirmed. Show the QR code below at the event gate entrance.</p>
    
    <div class="card mb-4 border-0 shadow-sm mx-auto" style="max-width: 250px;">
      <div class="card-body p-3 bg-white rounded">
        <qrcode [qrdata]="qrData" [width]="200" [errorCorrectionLevel]="'M'"></qrcode>
        <span class="small text-dark font-weight-bold d-block mt-2">ID: {{ bookingId }}</span>
      </div>
    </div>
    
    <button type="button" class="btn btn-lg btn-default w-100 shadow rounded" (click)="goHome()">
      Back to Home
    </button>
    
  </div>
</div>
