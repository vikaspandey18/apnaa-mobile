<!-- welcome user -->
<div class="row mb-4">
  <div class="col-auto">
    <div class="avatar avatar-50 shadow rounded-10">
      <img
        [src]="(customer$ | async)?.image ? (customer$ | async)?.image : 'assets/img/user1.jpg'"
        alt="Customer Avatar"
      />
    </div>
  </div>
  <div class="col align-self-center ps-0">
    <h4 class="text-color-theme">
      <span class="fw-normal">Hi</span>, {{ (customer$ | async)?.name | uppercase }}
    </h4>
    <p class="text-muted">Welcome to Apna Entry</p>
  </div>
</div>

<!-- banners -->
<div class="row mb-3" *ngIf="banners.length > 0">
  <div class="col-12">
    <swiper class="bannerswiper" [slidesPerView]="1" [spaceBetween]="10" [pagination]="true">
      <ng-template swiperSlide *ngFor="let banner of banners">
        <img
          [src]="banner.bannerImage || banner.image"
          [alt]="banner.title"
          class="img-fluid rounded-15 shadow-sm"
          style="width: 100%; max-height: 160px; object-fit: cover;"
        />
      </ng-template>
    </swiper>
  </div>
</div>

<!-- categories tags slider -->
<div class="row mb-3" *ngIf="categories.length > 0">
  <div class="col-12 px-0">
    <swiper class="tagsswiper" [slidesPerView]="'auto'" [spaceBetween]="10" [pagination]="false">
      <ng-template swiperSlide>
        <div class="tag font-weight-bold" [class.active]="selectedCategoryId === null" (click)="showAll()">
          ALL
        </div>
      </ng-template>
      <ng-template swiperSlide *ngFor="let cat of categories">
        <div class="tag font-weight-bold" [class.active]="selectedCategoryId === cat.id" (click)="filterByCategory(cat.id)">
          {{ cat.name | uppercase }}
        </div>
      </ng-template>
    </swiper>
  </div>
</div>

<!-- events list section -->
<div class="row px-2">
  <div class="col-12 mb-3">
    <h5 class="text-color-theme font-weight-bold mb-0">Upcoming Events</h5>
  </div>

  <div class="col-12" *ngIf="loadingEvents">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only"></span>
      </div>
      <p class="text-muted mt-2">Loading events list...</p>
    </div>
  </div>

  <div class="col-12" *ngIf="!loadingEvents && filteredEvents.length === 0">
    <p class="text-center text-muted py-5">No events available in this category.</p>
  </div>

  <div class="col-6 col-md-4 col-lg-3 mb-4" *ngFor="let event of filteredEvents">
    <div class="card event-card h-100 border-0 bg-transparent text-decoration-none" [routerLink]="['/customer/event', event.id]" style="cursor: pointer;">
      <!-- Poster Image Container -->
      <div class="poster-container position-relative overflow-hidden rounded-15 shadow-sm mb-2" style="aspect-ratio: 2/3; width: 100%;">
        <img *ngIf="event.eventImg || event.image; else noImage"
          [src]="event.eventImg || event.image"
          [alt]="event.title"
          class="w-100 h-100"
          style="object-fit: cover;"
        />
        <ng-template #noImage>
          <div class="no-image-placeholder w-100 h-100 d-flex flex-column align-items-center justify-content-center text-center px-2">
            <i class="bi bi-ticket-perforated mb-2 fs-2"></i>
            <span class="placeholder-text font-weight-bold">APNA ENTRY</span>
          </div>
        </ng-template>
        
        <!-- Location Badge Overlay -->
        <span class="badge bg-dark bg-opacity-75 text-white position-absolute top-2 start-2 m-2 px-2 py-1 small rounded-pill d-flex align-items-center">
          <i class="bi bi-geo-alt-fill me-1 text-danger"></i> {{ event.city }}
        </span>
      </div>
      
      <!-- Metadata -->
      <div class="card-body p-0 d-flex flex-column justify-content-between">
        <div>
          <h6 class="text-color-theme font-weight-bold mb-1 text-truncate-2" style="font-size: 0.9rem; line-height: 1.3;">
            {{ event.title }}
          </h6>
          <p class="text-muted small mb-2 text-truncate" style="font-size: 0.75rem;">
            {{ event.description || 'No description available' }}
          </p>
        </div>
        
        <div class="mt-auto">
          <button class="btn btn-default btn-sm w-100 rounded-pill py-1-5 font-weight-bold">
            Book Now
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
