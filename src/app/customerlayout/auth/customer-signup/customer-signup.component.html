<div class="row h-100">
    <div class="col-12 text-center mb-auto px-0">
        <header class="header">
            <div class="row">
                <div class="col-auto">
                    <a [routerLink]="['/customer/login']" [queryParams]="getReturnUrl() ? { returnUrl: getReturnUrl() } : null" target="_self" class="btn btn-light btn-44">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                </div>
                <div class="col align-self-center">
                    <h5>Sign up</h5>
                </div>
                <div class="col-auto">
                    <a class="btn btn-light btn-44 invisible"></a>
                </div>
            </div>
        </header>
    </div>
    <div class="col-10 col-md-6 col-lg-5 col-xl-3 mx-auto align-self-center text-center py-4">
        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            
            <div class="form-floating mb-3">
                <input type="text" class="form-control" placeholder="Full Name" id="name" formControlName="name">
                <label for="name">Full Name</label>
            </div>
            <div *ngIf="signupForm.controls.name.touched && signupForm.controls.name.invalid" class="text-danger small mb-2 text-left">
                Name must be at least 2 characters.
            </div>

            <div class="form-floating mb-3">
                <input type="number" class="form-control" placeholder="Mobile Number" id="mobile" formControlName="mobile">
                <label for="mobile">Mobile</label>
            </div>
            <div *ngIf="signupForm.controls.mobile.touched && signupForm.controls.mobile.invalid" class="text-danger small mb-2 text-left">
                Please enter a valid 10-digit mobile number.
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" placeholder="Email Address" id="email" formControlName="email">
                <label for="email">Email (Optional)</label>
            </div>
            <div *ngIf="signupForm.controls.email.touched && signupForm.controls.email.invalid" class="text-danger small mb-2 text-left">
                Please enter a valid email address.
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" placeholder="Password" id="password" formControlName="password">
                <label for="password">Password</label>
            </div>
            <div *ngIf="signupForm.controls.password.touched && signupForm.controls.password.invalid" class="text-danger small mb-2 text-left">
                Password must be at least 6 characters.
            </div>

            <button type="submit" [disabled]="loading" class="btn btn-lg btn-default w-100 mb-4 shadow">
                {{ loading ? "Signing Up..." : "Sign up" }}
            </button>
        </form>

        <div *ngIf="errorMessage" class="mt-3">
            <p class="text-danger">{{ errorMessage }}</p>
        </div>
    </div>
    <div class="col-12 text-center mt-auto"></div>
</div>
