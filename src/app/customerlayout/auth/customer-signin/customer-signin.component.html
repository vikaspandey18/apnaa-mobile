<div class="row h-100 overflow-auto">
    <div class="col-12 text-center mb-auto px-0">
        <header class="header">
            <div class="row">
                <div class="col-auto"></div>
                <div class="col">
                    <div class="logo-small">
                        <img src="assets/apnaentrylogobg.png" alt="Apna Logo">
                    </div>
                </div>
                <div class="col-auto"></div>
            </div>
        </header>
    </div>
    <div class="col-10 col-md-6 col-lg-5 col-xl-3 mx-auto align-self-center text-center py-4">
        <h1 class="mb-4 text-color-theme">Sign in</h1>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group form-floating mb-3">
                <input type="number" class="form-control" id="mobile" placeholder="Mobile" formControlName="mobile">
                <label class="form-control-label" for="mobile">Mobile</label>
            </div>
            <div>
                <small *ngIf="loginForm.controls.mobile.touched && loginForm.controls.mobile.invalid" class="text-danger">
                    Mobile Number Not valid
                </small>
            </div>
            
            <div class="form-group form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" formControlName="password">
                <label class="form-control-label" for="password">Password</label>
            </div>
            <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid" class="text-danger">
                Password required
            </small>
            <p class="mb-3 text-center"></p>

            <button type="submit" [disabled]="loading" class="btn btn-lg btn-default w-100 mb-4 shadow">
                {{ loading ? "Loading..." : "Sign In" }}
            </button>
        </form>

        <p class="mb-2 text-muted">Don't have account?</p>
        <a routerLink="/customer/register" target="_self" class="">
            Sign up <i class="bi bi-arrow-right"></i>
        </a>

        <div *ngIf="errorMessage" class="mt-3">
            <p class="text-danger">{{ errorMessage }}</p>
        </div>
    </div>
    <div class="col-12 text-center mt-auto">
        <div class="row justify-content-center footer-info"></div>
    </div>
</div>
