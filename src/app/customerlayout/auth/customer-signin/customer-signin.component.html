<div class="row h-100 overflow-auto align-items-center justify-content-center min-vh-100 mx-0">
    <div class="col-12 text-center mb-auto px-0">
        <header class="header">
            <div class="row">
                <div class="col-auto"></div>
                <div class="col">
                    <div class="logo-small py-3">
                        <img src="assets/apnaentrylogobg.png" alt="Apna Logo" style="height: 50px;">
                    </div>
                </div>
                <div class="col-auto"></div>
            </div>
        </header>
    </div>
    <div class="col-10 col-md-6 col-lg-5 col-xl-3 mx-auto align-self-center text-center py-4">
        <h1 class="mb-4 text-color-theme font-weight-bold">Customer Sign In</h1>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group form-floating mb-3">
                <input type="tel" class="form-control" id="mobile" placeholder="Mobile Number" formControlName="mobile">
                <label class="form-control-label" for="mobile">Mobile Number (10 digits)</label>
                <div *ngIf="loginForm.controls.mobile.touched && loginForm.controls.mobile.invalid" class="text-danger small mt-1 text-left">
                    Please enter a valid 10-digit mobile number.
                </div>
            </div>
            
            <div class="form-group form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" formControlName="password">
                <label class="form-control-label" for="password">Password</label>
                <div *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid" class="text-danger small mt-1 text-left">
                    Password is required.
                </div>
            </div>

            <button type="submit" [disabled]="loading" class="btn btn-lg btn-default w-100 mb-4 shadow">
                {{ loading ? "Signing In..." : "Sign In" }}
            </button>
        </form>

        <p class="mb-2 text-muted">Don't have an account?</p>
        <a routerLink="/customer/register" class="font-weight-bold text-primary">
            Sign up <i class="bi bi-arrow-right"></i>
        </a>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3 py-2 text-center small shadow-sm">
            {{ errorMessage }}
        </div>
    </div>
    <div class="col-12 text-center mt-auto py-3"></div>
</div>
