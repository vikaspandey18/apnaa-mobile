<div class="row h-100 overflow-auto">
    <div class="col-12 text-center mb-auto px-0">
        <header class="header">
            <div class="row">
                <div class="col-auto"></div>
                <div class="col">
                    <div class="logo-small">
                        <img src="assets/apnaentrylogobg.png" alt="Apna Logo">
                        <!-- <h5>Apnaa Entry</h5> -->
                    </div>
                </div>
                <div class="col-auto"></div>
            </div>
        </header>
    </div>
    <div class="col-10 col-md-6 col-lg-5 col-xl-3 mx-auto align-self-center text-center py-4">
        <h1 class="mb-4 text-color-theme">Sign in</h1>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group form-floating mb-3 is-valid">
                <input type="number" class="form-control" id="mobile" placeholder="Mobile" formControlName="mobile">
                <label class="form-control-label" for="mobile">Mobile</label>
            </div>
            <div>
                <small *ngIf="loginForm.controls.mobile.touched && loginForm.controls.mobile.invalid">
                    Mobile Number Not valid
                </small>
            </div>
            <div class="form-group form-floating is-invalid mb-3">
                <input type="password" class="form-control " id="password" placeholder="Password"
                    formControlName="password">
                <label class="form-control-label" for="password">Password</label>
            </div>
            <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
                Password required
            </small>
            <p class="mb-3 text-center">
                <!-- <a routerLink="/forgetpassword" class="">
                    Forgot your password?
                </a> -->
            </p>

            <button type="submit" [disabled]=" loading$|async" class="btn btn-lg btn-default w-100 mb-4 shadow">
                {{(loading$| async) ? "Loading..." : "Sign In"}}
            </button>
        </form>
        <!-- <p class="mb-2 text-muted">Don't have account?</p> -->
        <!-- <a routerLink="/signup" target="_self" class="">
            Sign up <i class="bi bi-arrow-right"></i>
        </a> -->
        <div *ngIf="error$|async">
            <p class="text-danger">{{error$|async}}</p>
        </div>
    </div>
    <div class="col-12 text-center mt-auto">
        <div class="row justify-content-center footer-info">
            <!-- <div class="col-auto">
                <p class="text-muted">Or you can continue with </p>
            </div>
            <div class="col-auto ps-0">
                <a routerLink="#" class="p-1"><i class="bi bi-twitter"></i></a>
                <a routerLink="#" class="p-1"><i class="bi bi-google"></i></a>
                <a routerLink="#" class="p-1"><i class="bi bi-facebook"></i></a>
            </div> -->
        </div>
    </div>


</div>
