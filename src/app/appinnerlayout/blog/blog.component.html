<!-- categories -->
<div class="row">
    <!-- <pre>{{ events$ | async | json }}</pre> -->
    <div class="col-12 col-md-12" *ngIf="loading$ | async">
        <h6>Loading...</h6>
    </div>
    <div class="col-12 col-md-6" *ngFor="let event of events$ | async ">
        <div class="card mb-4 overflow-hidden shadow-sm bg-primary text-white">
            <div class="overlay"></div>
            <div class="coverimg h-100 w-100 position-absolute opacity-5"
                [style.background-image]="'url(' + (event?.eventImg || 'assets/img/news1.jpg') + ')'">
                <img [src]="event?.eventImg || 'assets/img/news1.jpg'" alt="" class="d-none">
            </div>
            <div class="card-body">
                <div class="row mb-5">
                    <div class="col align-self-center">
                        <span class="tag">{{event?.city}} {{event?.state}}</span>
                    </div>
                    <div class="col-auto">
                        <a [routerLink]="['/blogdetails', event.id]"
                            class="btn btn-success text-white  shadow-sm">
                            <!-- <i class="bi bi-plus-circle"></i> -->
                             Book
                        </a>
                    </div>
                </div>
                <br>
                <a [routerLink]="['/blogdetails', event.id]" class="h4 text-normal d-block text-white mb-2">
                    {{ event?.title || 'Event Title' }}</a>
                <p class="text-muted">
                    {{ event?.description || 'Event Description' }}
                </p>
                <div class="small">
                    <figure class="avatar avatar-20 rounded mx-1">
                        <img [src]="event?.organizer_logo ? event?.organizerImg : 'assets/img/user2.jpg'" alt="">
                    </figure>
                    {{ event?.organizer_name || 'Organizer Name' }}
                </div>
            </div>
        </div>
    </div>

</div>
