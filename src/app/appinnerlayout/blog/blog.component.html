<!-- categories -->
<div class="row mb-3">
  <div class="col-12 px-0">
    <swiper class="tagsswiper" [slidesPerView]="'auto'" [spaceBetween]="10" [pagination]="false">
      <ng-template swiperSlide>
        <div class="tag" [class.active]="selectedCategoryId === null" (click)="showAll()">
          All
        </div>
      </ng-template>

      <ng-template swiperSlide *ngFor="let category of category$ | async">
        <div class="tag" [class.active]="selectedCategoryId === category.id" (click)="filterByCategory(category.id)">
          {{ category.name | uppercase }}
        </div>
      </ng-template>
    </swiper>
  </div>
</div>
<div class="row">
  <!-- <pre>{{ events$ | async | json }}</pre> -->
  <div class="col-12 col-md-12" *ngIf="loading$ | async">
    <h6>Loading...</h6>
  </div>
  <div class="col-12 col-md-6 mb-2" *ngFor="let event of filteredEvents$ | async">
    <div class="card mb-2 overflow-hidden shadow-sm border-0 h-100">
      <div class="row g-0 h-100">
        <div class="col-4 col-sm-4 position-relative" style="min-height: 100px">
          <div class="coverimg h-100 w-100 position-absolute start-0 top-0" [style.background-image]="
              'url(' +
              (event?.eventImg || event?.image || 'assets/img/news1.jpg') +
              ')'
            " style="background-size: cover; background-position: center">
            <img [src]="event?.eventImg || event?.image || 'assets/img/news1.jpg'" alt="" class="d-none" />
          </div>
        </div>
        <div class="col-8 col-sm-8 d-flex flex-column pl-0">
          <div class="card-body d-flex flex-column justify-content-between h-100 p-2">
            <div>
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="badge bg-light text-white" style="font-size: 0.7rem; padding: 0.2rem 0">
                  {{ event?.city }} {{ event?.state }}
                </span>
              </div>
              <a [routerLink]="['/blogdetails', event.id]"
                class="h6 text-normal d-block text-white mb-1 font-weight-bold" style="
                  text-decoration: none;
                  font-size: 0.9rem;
                  line-height: 1.2;
                ">
                {{ event?.title || "Event Title" }}
              </a>
              <p class="small text-muted mb-1" style="
                  display: -webkit-box;
                  -webkit-box-orient: vertical;
                  overflow: hidden;
                  font-size: 0.75rem;
                  line-height: 1.3;
                ">
                {{ event?.description || "Event Description" }}
              </p>
            </div>

            <div class="d-flex align-items-center justify-content-between mt-1 pt-1 border-top">
              <div class="small text-muted d-flex align-items-center">
                <figure class="avatar avatar-20 rounded-circle me-1 mb-0" style="
                    width: 18px;
                    height: 18px;
                    overflow: hidden;
                    display: inline-block;
                  ">
                  <img [src]="
                      event?.organizer_logo
                        ? event?.organizerImg
                        : 'assets/img/user2.jpg'
                    " alt="" style="width: 100%; height: 100%; object-fit: cover" />
                </figure>
                <span class="text-truncate" style="max-width: 80px; font-size: 0.75rem">
                  {{ event?.organizer_name || "Organizer Name" }}
                </span>
              </div>
              <a [routerLink]="['/blogdetails', event.id]" class="btn btn-sm btn-success text-white shadow-sm py-1 px-2"
                style="font-size: 0.75rem; line-height: 1">
                Book Now
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
