<!-- list data request money -->
<!-- <h3 class="mb-3">Name: {{promoterName}}</h3> -->

<div class="card mb-3" *ngIf="promoter$ | async as promoter">
    <div class="card-body position-relative">

        <div class="form-check position-absolute end-0 top-0 m-2">
            <input class="form-check-input rounded-circle" name="cardselect" type="radio" id="card1" />
        </div>

        <div class="row align-items-center">

            <!-- Profile Image -->
            

            <!-- Promoter Details -->
            <div class="col">

                <h4 class="fw-semibold mb-1">

                    {{ promoter.name?.toUpperCase() }}

                </h4>

                <p class="mb-1 text-muted">

                    <i class="bi bi-telephone"></i>

                    {{ promoter.mobile }}

                </p>

                <p class="mb-1 text-muted">

                    <i class="bi bi-envelope"></i>

                    {{ promoter.email || "-" }}

                </p>

                <p class="mb-0">

                    <span class="fw-semibold">
                        Credit:
                    </span>

                    ₹{{ promoter.credit_amt || 0 }}

                </p>

            </div>
        </div>
    </div>
</div>


<div *ngIf="transacLoading$ | async">
    Loading transactions...
</div>
<div *ngIf="transacError$ | async as error">
    {{ error }}
</div>
<ng-container *ngIf="!(transacLoading$ | async)">
    <ng-container *ngIf="(latestTransaction$ | async) as transactions">
        <div *ngIf="transactions.length > 0; else noData">
            <div class="row">
                <div class="col">
                    <div class="card mb-3" *ngFor="let item of (latestTransaction$ | async)">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-auto">
                                    <div class="avatar avatar-44 shadow-sm rounded-10">
                                        <img [src]="item.eventImage ? item.imageUrl : 'assets/favicon.png' " alt="">
                                    </div>
                                </div>
                                <div class="col align-self-center ps-0">
                                    <p class="text-color-theme mb-0">{{ item.eventTitle }}</p>
                                    <p class="text-muted size-12">{{item.customerName}}</p>
                                </div>
                                <div class="col-auto align-self-center text-end">
                                    <p class="mb-0">{{item.rate}}
                                        <!-- <a [routerLink]="['/viewtransaction', item.id]"><i
                                                class="bi bi-eye text-danger"></i></a> -->
                                    </p>
                                    <p class="text-muted size-12">{{item.createDate}}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>


        <ng-template #noData>
            <div class="text-center mt-4 text-muted">
                No records found
            </div>
        </ng-template>
    </ng-container>
</ng-container>
