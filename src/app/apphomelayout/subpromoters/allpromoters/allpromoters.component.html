<!-- connection -->
<div class="row mb-3">
  <div class="col">
    <h6 class="title">Sub Promoters</h6>
  </div>
  <div class="col-auto">
    <a routerLink="/subpromoters" class="small">View all</a>
  </div>
</div>
<div class="row mb-3">
  <div class="col-12 px-0">
    <div *ngIf="error$ | async as error" class="text-danger">
      {{ error }}
    </div>
    <!-- swiper users connections -->
    <swiper
      class="connectionwiper"
      [slidesPerView]="'auto'"
      [spaceBetween]="0"
      [pagination]="false"
    >
      <ng-container *ngIf="(promoterType$ | async) !== 'subpromoter'">
        <ng-template swiperSlide>
          <a routerLink="/addpromoter" class="card text-center">
            <div class="card-body">
              <figure class="avatar avatar-50 mb-1 rounded-10">
                <i class="bi bi-plus-lg" style="font-size: 25px"></i>
              </figure>
              <p class="text-color-theme size-12 small">Add</p>
            </div>
          </a>
        </ng-template>
      </ng-container>

      <ng-template swiperSlide *ngIf="loading$ | async">
        <ngx-skeleton-loader
          appearance="circle"
          [theme]="{ height: '100px', width: '100px' }"
        >
        </ngx-skeleton-loader>
        <ngx-skeleton-loader
          appearance="circle"
          [theme]="{ height: '100px', width: '100px' }"
        >
        </ngx-skeleton-loader>
      </ng-template>

      <ng-template swiperSlide *ngFor="let promoter of allPromoters$ | async">
        <a
          [routerLink]="['/sub-promoter-profile', promoter.id, promoter.name]"
          class="card text-center"
        >
          <div class="card-body">
            <figure class="avatar avatar-50 shadow-sm mb-1 rounded-10">
              <img
                [src]="
                  promoter.image ? promoter.imageUrl : 'assets/img/user1.jpg'
                "
                alt=""
              />
            </figure>
            <p class="text-color-theme size-12 small">{{ promoter.name }}</p>
          </div>
        </a>
      </ng-template>
    </swiper>
  </div>
</div>
