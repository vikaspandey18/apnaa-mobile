<form [formGroup]="promoterForm" (ngSubmit)="onSubmit()">
    <div class="row mb-4">
        <div class="col-12 col-md-6 col-lg-4 mx-auto">
            <h3 class="mb-2 text-center text-color-theme">Add Promoter</h3>

            <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
            </div>

            <div class="form-floating mb-2">
                <input type="text" class="form-control" placeholder="" formControlName="name" required>
                <label>Name *</label>
            </div>
            <div class="text-danger mb-1">
                {{ getError('name') }}
            </div>
            <div class="form-floating mb-2">
                <input type="number" class="form-control" placeholder="" formControlName="mobile" required>
                <label>Mobile *</label>
            </div>
            <div class="text-danger mb-1">
                {{ getError('mobile') }}
            </div>
            <div class="form-floating mb-2">
                <input type="email" class="form-control" placeholder="" formControlName="email">
                <label>Email</label>
            </div>
            <div class="text-danger mb-1">
                {{ getError('email') }}
            </div>
            <div class="form-floating mb-2">
                <input type="number" class="form-control" placeholder="" formControlName="credit_amt" required>
                <label>Credit Amount *</label>
            </div>
            <div class="text-danger mb-1">
                {{ getError('credit_amt') }}
            </div>
            <div class="form-floating mb-3">
                <input type="number" class="form-control" placeholder="" formControlName="commission_percent">
                <label>Commission Percent </label>
            </div>
            <button type="submit" class="btn btn-default btn-lg w-100"
                [disabled]="promoterForm.invalid || isSubmitting">
                {{ isSubmitting ? 'Submitting...' : 'Submit' }}
            </button>
        </div>
    </div>
</form>
