<form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="row mb-4">
        <div class="col-12 col-md-6 col-lg-4 mx-auto">

            <h3 class="mb-2 text-center text-color-theme">Make your booking</h3>

            <div class="form-floating mb-3">
                <input type="number" class="form-control" formControlName="noOfTicket" required>
                <label>No of Ticket *</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" placeholder="" formControlName="customerName" required>
                <label>Customer Name *</label>
            </div>

            <div class="form-floating mb-3">
                <input type="number" class="form-control" placeholder="" formControlName="customerMobileNo" required>
                <label>Customer Mobile No *</label>
            </div>

            <div class="text-danger mt-1" *ngIf="form.get('customerMobileNo')?.invalid && form.get('customerMobileNo')?.touched">
                <small *ngIf="form.get('customerMobileNo')?.errors?.required">
                    Mobile number is required.
                </small>

                <small *ngIf="form.get('customerMobileNo')?.errors?.pattern">
                    Mobile number must be exactly 10 digits.
                </small>
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" placeholder="" formControlName="customerEmail">
                <label>Customer Email</label>
            </div>
            <div class="text-danger mt-1" *ngIf="form.get('customerEmail')?.invalid && form.get('customerEmail')?.touched">
                <small *ngIf="form.get('customerEmail')?.errors?.required">
                    Email is required.
                </small>

                <small *ngIf="form.get('customerEmail')?.errors?.email">
                    Not a valid email
                </small>
            </div>
            <div class="form-floating mb-3">
                <select class="form-control" id="payment" formControlName="paymentStatus" required>
                    <option value="" disabled>Select Payment</option>
                    <option value="Pending">Pending</option>
                    <option value="Paid">Paid</option>
                </select>
                <label for="payment">Payment</label>
            </div>
            <div class="form-floating mb-3">
                <input type="number" class="form-control" placeholder="" formControlName="amt_note">
                <label>Pay Amount</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" placeholder="" formControlName="notes">
                <label>Customer Notes</label>
            </div>

            <div class="mb-3">
                <h5 [ngClass]="{'text-danger': hasInsufficientCredit}">Total Amt : ₹ {{ totalAmount }}</h5>
                <p class="text-danger mb-0" *ngIf="hasInsufficientCredit">
                    Insufficient credit!
                </p>
                <p class="text-danger" *ngIf="hasInsufficientCredit">
                    Available balance: ₹ {{ (credit_amt$ | async) ?? 0 }}
                </p>
            </div>

            <button type="submit" class="btn btn-default btn-lg w-100"
                [disabled]="form.invalid || isSubmitting || hasInsufficientCredit">
                {{ isSubmitting ? 'Submitting...' : 'Submit' }}
            </button>

            <!-- Response Message -->
            <div *ngIf="responseMessage" class="alert mt-3" [ngClass]="isSuccess ? 'alert-success' : 'alert-danger'">
                {{ responseMessage }}
            </div>

        </div>
    </div>

</form>
